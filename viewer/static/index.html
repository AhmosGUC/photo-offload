<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Backup</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="sidebar">
  <div class="brand">Photo Backup</div>
  <nav><a href="phone.html"><span>📱 Connected phone →</span></a></nav>

  <label class="label" for="phone">Phone</label>
  <select id="phone"></select>

  <div class="label">Library</div>
  <nav id="views"></nav>

  <div class="label">Albums</div>
  <nav id="albums"></nav>

  <button id="reindex" class="ghost" title="Re-scan ~/PhotoBackup after a new backup run">↻ Rescan backup</button>
</aside>

<main id="main">
  <header id="topbar">
    <button id="menu" class="icon" aria-label="Menu">☰</button>
    <h1 id="title">All Photos</h1>
    <span id="count"></span>
    <label class="zoom">Size <input id="zoom" type="range" min="90" max="320" step="10" value="170"></label>
  </header>
  <section id="grid"></section>
  <div id="sentinel"></div>
  <p id="empty" hidden>Nothing here yet.</p>
</main>

<div id="viewer" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <div class="v-stage">
    <img id="v-img" alt="">
    <video id="v-live" playsinline hidden></video>
    <video id="v-video" controls playsinline hidden></video>
  </div>
  <button class="icon v-close" aria-label="Close">✕</button>
  <button class="icon v-prev" aria-label="Previous">‹</button>
  <button class="icon v-next" aria-label="Next">›</button>
  <div class="v-bar">
    <button id="v-livebtn" class="pill" hidden>◉ LIVE</button>
    <button id="v-sound" class="pill" title="Sound on/off (M)">🔊</button>
    <button id="v-autolive" class="pill" title="Play Live Photos automatically when opened (L)">Auto Live: On</button>
    <div id="v-meta"></div>
    <a id="v-download" class="pill" download>Download original</a>
  </div>
</div>

<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
